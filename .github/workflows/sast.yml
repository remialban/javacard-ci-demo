name: Semgrep

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    
    container:
      image: semgrep/semgrep

    steps:
      - name : Checkout code
        uses: actions/checkout@v3
      
      - name: Run Semgrep
        run: semgrep --config=auto