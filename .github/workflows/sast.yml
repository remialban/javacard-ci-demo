name: Semgrep

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write
      actions: read
      
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config p/java --sarif --output semgrep.sarif --error
      - name: Upload Semgrep report
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() }}
        with:
          sarif_file: semgrep.sarif
