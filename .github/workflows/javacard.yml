name: Java Card CI

on:
  workflow_run: 
    workflows: ["Semgrep"]
    types:
      - completed

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib libpcsclite1 pcsc-tools wget unzip

      - name: Setup Java (Temurin JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use JCDK from repository
        run: |
          echo "JC_HOME=$PWD/tools/jcdk" >> $GITHUB_ENV
          echo "PATH=$PWD/tools/jcdk/bin:$PATH" >> $GITHUB_ENV

      - name: Download ECJ
        run: |
          mkdir -p lib
          wget -O lib/ecj.jar https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.33.0/ecj-3.33.0.jar

      - name: Build CAP
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Run tests
        run: |
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh
  
      - uses: actions/upload-artifact@v7
        with:
          name: insa-cap
          path: build/cap/fr/insa/javacard/insa.cap
  post-release:
    needs: build-and-test

    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: insa-cap
      
      # Publish the CAP file to GitHub Releases
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.ref }}
          release_name: Release ${{ github.ref }}
        
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            insa-cap